name: Build and Deploy Site
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: flyctl deploy -a drn-ie
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
